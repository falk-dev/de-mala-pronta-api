<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Viagens</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>

<body>
  <p><a href="index.html">Início</a></p>
  <h1>Viagens</h1>

  <button type="button" id="novo">Nova viagem</button>
  <p id="mensagem"></p>

  <dialog id="modal">
    <h2 id="modal-titulo"></h2>
    <form id="form">
      <input type="hidden" id="id">
      <label>Título
        <input type="text" id="titulo">
      </label>
      <label>Data de início
        <input type="date" id="data_inicio">
      </label>
      <label>Data de fim
        <input type="date" id="data_fim">
      </label>
      <label>Orçamento (R$)
        <input type="number" step="0.01" min="0" id="orcamento">
      </label>
      <label>Status
        <select id="status">
          <option value="planejada">Planejada</option>
          <option value="em andamento">Em andamento</option>
          <option value="concluida">Concluída</option>
        </select>
      </label>
      <p id="erro"></p>
      <div class="botoes">
        <button type="submit">Salvar</button>
        <button type="button" id="cancelar">Cancelar</button>
      </div>
    </form>
  </dialog>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Início</th>
        <th>Fim</th>
        <th>Orçamento</th>
        <th>Status</th>
        <th>Total despesas</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

  <script src="/scripts/viagem.js"></script>
</body>

</html>
